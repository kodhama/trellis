verdict = "PASS (dispatcher-verified) — two Codex findings on trellis#231, both confirmed against source before fixing. P1: the probe matched AGENTS.md unconditionally, but decision-0057 states 'Claude Code can import AGENTS.md from CLAUDE.md; Codex discovers AGENTS.md directly' — so a Codex-facing inline block in an unimported AGENTS.md made THIS host refuse delivery over content it never loaded, leaving an otherwise plugin-governed Claude session ungoverned while the refusal claimed the block was loaded. That is decision-0073's own defect class, and D2's recorded reason for the two-file subset ('refuse only over files this host actually loads') is exactly the test it failed. The probe now gates AGENTS.md on a CLAUDE.md @AGENTS.md import. P2: the missing-rules.toml remedy said 'copy rules-b.toml' unconditionally, silently downgrading a firm block-inline-a project to adaptive; the block embeds its own strictness value, so the remedy now says to read it first and copy the matching preset. TWO PRE-EXISTING FIXTURES ENCODED THE P1 DEFECT and failed correctly under the fix — both corrected in precondition (the AGENTS.md refusal fixture now imports; the multi-file fixture makes CLAUDE.md both carry a block and import) without weakening their coverage, and the un-imported case is newly pinned. Both fixes mutation-proven: removing the import gate turns the new subtest red on 'refused over a block this host never loaded'; reverting the posture wording turns the sibling red on 'must preserve the block's own posture'. Manifest advanced; gate green 12.3s; guard exit 0. NOTE FOR THE MAINTAINER: decision-0073 D2's literal text names 'CLAUDE.md and AGENTS.md only'; this fix makes AGENTS.md conditional on the import. It implements D2's stated RATIONALE more faithfully than D2's literal file list — whether the clause itself wants amending is a maintainer call, surfaced on the PR."
