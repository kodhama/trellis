name: Claude Code Review

# Runs Claude's code-review skill on every PR, by default.
# Prerequisites (one-time, repo admin only — see decision 0007):
#   1. Install the Claude GitHub App: https://github.com/apps/claude
#   2. Add the auth secret the App's installer creates (CLAUDE_CODE_OAUTH_TOKEN for a
#      Claude subscription, or swap to ANTHROPIC_API_KEY for direct API billing).
# The easiest way to do both: run `/install-github-app` in Claude Code and choose
# "Skip for now" at the workflow step (this file already provides the workflow).

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write # required by claude-code-action@v1 for OIDC token exchange

jobs:
  review:
    runs-on: ubuntu-latest
    # 20, matching grove/stewards/wisp/design-system. At 10 this cap was the
    # thing PREVENTING review: the /code-review skill spawns background agents,
    # and trellis runs were being cut off before they returned — PR #206 was
    # CANCELLED at 10m16s, and #212 ended mid-sentence at 8 turns with "Both
    # background agents are running — I will wait for their results" and posted
    # nothing. Still a fail-fast cap against an infra hang, just above the work.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history so the review can diff against the base branch

      - name: Claude code review
        uses: anthropics/claude-code-action@v1
        with:
          # Subscription auth (no separate API bill). Swap to:
          #   anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # if you prefer direct Claude API billing instead.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          # --comment makes the skill POST findings as inline PR comments (without it,
          # the review runs but buffers nothing — "No buffered inline comments").
          # The override below answers three more causes, all proved on
          # kodhama/stewards and rolled out here unchanged.
          #
          # Cause 10 is the trap to know about if you edit the Scope line: an
          # interpolation left to render bare produces `..<sha>` on the three
          # non-push triggers, and that is a *valid* rev range — `gitrevisions`
          # defaults the omitted side to HEAD, and actions/checkout puts HEAD on
          # the merge ref, so it resolves to EMPTY. A model executing it finds
          # nothing changed and ends green having reviewed nothing. Hence the
          # ternary rather than a bare interpolation.
          #
          # The override quotes upstream's criterion TEXT, not its step numbers:
          # `plugins:` pins no ref, so upstream may renumber, and a silently
          # non-matching override degrades to green-and-empty.
          #
          # `fetch-depth: 1` means a named range is not resolvable locally
          # without a fetch; the prompt names the compare API instead.
          #
          # Original two causes, both proved on
          # kodhama/stewards and rolled out here unchanged.
          #
          # Cause 8 (stewards#66) — the upstream skill's step 1 stops when the PR
          # "already has a code review from you from earlier", and step 7
          # re-checks it. That asks whether Claude has COMMENTED, never whether
          # it reviewed THIS COMMIT, so after one review every later push ships
          # unreviewed behind a green tick. The skill is upstream and cannot be
          # edited here; the prompt outranks it. On a push the event carries the
          # exact new range, so the review is scoped rather than repeated.
          #
          # Cause 9 (stewards#63) — the skill delegates every step to subagents,
          # and the model sometimes treats a dispatch as asynchronous and ends
          # its turn waiting. Correct in a session where a notification arrives;
          # fatal here, where the process exits with the turn. Four of nine
          # measured runs died this way, green, having delivered nothing.
          #
          # Verified on kodhama/stewards#103: a second review landed on a PR
          # that already had one, scoped to `ecdd6400..eecc706e`.
          prompt: |
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment

            Override, and it applies both to the eligibility check and to the
            re-check before commenting. The criterion "already has a code review
            from you from earlier" does NOT disqualify this run. This workflow fires once per push, and
            a commit pushed after an earlier review is the commit most worth
            reviewing. Proceed even though you have commented here before.

            Scope: ${{ github.event.before && format('review ONLY the commits pushed in this event, {0}..{1} — confine yourself to what changed in that range', github.event.before, github.event.pull_request.head.sha) || 'this trigger carries no pushed range; review the pull request as a whole' }}

            The checkout is shallow, so a named range may not resolve locally.
            Prefer `gh api repos/${{ github.repository }}/compare/<base>...<head>`
            over `git log`, or fetch first if you use git.

            Either way: do not restate a finding your earlier comments already
            make. If an earlier finding is now fixed, say so in one line rather
            than repeating it, and if nothing in scope warrants a comment, do
            not comment.

            You are running headless in CI. Nothing will notify you when a
            delegated agent finishes, and this process exits when your turn
            ends. So do not end your turn waiting for anything: dispatch a
            subagent only where you will read its result in this same turn, and
            carry every step through to the comment yourself. "I'll continue
            once they complete" is a failed run — it reports success and
            delivers nothing.
          # Without this the run log does not carry the review's own verdict, so a
          # run that delivered nothing is indistinguishable from one that found
          # nothing — and the evidence needed to tell them apart is the thing that
          # is missing. Measured on this repo: #204 ran three times (45s/56s/45s),
          # all `success`, zero comments; #202 ran ~5 min and posted "No issues
          # found". Duration was the only available signal.
          show_full_output: true
          # The review posts via `gh api ... --input` and locates/quotes this repo's
          # own rules with `find`/`grep`; both need Bash, and Write stages the
          # comment payloads under /tmp. Matched to what a known-good run in a
          # sibling repo actually used, not guessed.
          #
          # NOT a sandbox and not hardening — unrestricted Bash writes anywhere.
          # Read it as "what the job was handed".
          # `Skill`, `Agent` and `ToolSearch` added 2026-08-02, after all three
          # were proved missing in kodhama/stewards — evidence on stewards#63.
          #
          #   Skill      loads `/code-review:code-review`, which IS the review.
          #              Without it the run records
          #              "permission_denials": [{"tool_name": "Skill", ...}]
          #              and the job concludes success having reviewed nothing.
          #   Agent      the review delegates its gate check to a subagent.
          #              Without it the model reaches for `TaskCreate` instead
          #              and the client rejects the call.
          #   ToolSearch named by that same error as the remedy for a tool
          #              schema that was never sent.
          #
          # The original three-tool list was matched to the tools a known-good
          # run was seen USING — which cannot see the tools it needed in order
          # to start. Verified on kodhama/stewards#93: with all three present
          # the reviewer posted a verdict for the first time.
          claude_args: |
            --allowedTools Bash,Read,Write,Skill,Agent,ToolSearch
