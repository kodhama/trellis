name: codeql

# Static security analysis for the two shipped languages: the Go payload generator
# (cli/) and the plugin's JavaScript hooks (plugins/trellis/hooks/). Runs on every
# PR and on main, plus a weekly sweep so newly published queries evaluate the
# existing tree.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript]
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v4
