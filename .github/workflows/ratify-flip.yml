name: ratify-flip

# decision-0080 — record the approval act; never perform it.
#
# decision-0046 left the `gated -> approved` flip as a hand edit, and named the
# human's review-before-merge as the backstop against agent self-approval. It
# considered a machine-checkable guard ("allow the flip iff a human PR-approval
# review exists") and DEFERRED it to grove#38. decision-0076 then retired grove
# from this repo, so that deferral lost its consumer — an orphan follow-up under
# decision-0078. This workflow is that guard, finally built.
#
# THE SIGNAL IS THE REVIEW, NOT THE MERGE. An agent merging with the maintainer's
# token produces a `merged_by` identical to the maintainer's, so "merged" cannot
# carry the intent act.
#
# WHAT COUNTS AS THE SIGNAL. Every clause below was added because review of this
# file found the naive version ("state == APPROVED and login != author") unsafe:
#
#   1. WRITE ACCESS REQUIRED. kodhama/trellis is PUBLIC, and on a public repo any
#      GitHub account can submit an "Approve" review. Without a permission test, a
#      drive-by approval from a stranger would make this `contents: write` job push
#      to main — the bypass this guard exists to prevent. Reviews are filtered on
#      author_association, and the selected approver is then re-checked against the
#      collaborator permission API.
#   2. CURRENT REVIEWS ONLY. /pulls/{n}/reviews returns the whole history, so an
#      APPROVED review from an early revision survives later pushes — including a
#      push that adds the very record being flipped — and a later
#      CHANGES_REQUESTED does not erase it. Only reviews whose commit_id is the
#      merged head count, and only each reviewer's LATEST review is considered.
#   3. PAGINATION. Without --paginate the API returns 30 reviews; PR #218 in this
#      repo already has 33 (the per-push review bot), and reviews come oldest
#      first, so a late human approval would be silently dropped.
#
# DORMANT BY DESIGN, TODAY. Agents here author, review and merge as the
# maintainer, so "not the author" is never true and nothing is ever flipped: every
# gated record is reported and left gated. That is the honest state — a guard that
# flipped anyway would certify agent self-approval as the maintainer's. It starts
# enforcing the day agents get their own GitHub identity, with no change to this
# file.

on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

# Serialised because the job pushes to main. Two merges 27 seconds apart have
# happened in this repo; without this the second push is rejected non-fast-forward
# and the approval record is silently lost. Never cancel — a cancelled run drops
# the record it was about to write.
concurrency:
  group: ratify-flip-main
  cancel-in-progress: false

jobs:
  flip:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Record approvals a human review authorizes
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          changed="$(gh pr diff "${PR}" --name-only | grep '^decisions/.*\.md$' || true)"
          if [ -z "${changed}" ]; then
            echo "no decision records touched by #${PR} — nothing to record"
            exit 0
          fi

          gated=""
          for f in ${changed}; do
            [ -f "${f}" ] || continue
            if grep -q '^status: gated' "${f}"; then gated="${gated} ${f}"; fi
          done
          if [ -z "${gated}" ]; then
            echo "no gated records left by #${PR} — nothing to record"
            exit 0
          fi

          # The authorizing act, under every clause in the header above.
          approver="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR}/reviews" -q '.[]' \
            | jq -rs --arg head "${HEAD_SHA}" --arg author "${AUTHOR}" '
                [ .[] | select(.commit_id == $head) ]
                | group_by(.user.login)
                | map(max_by(.submitted_at))
                | map(select(
                    .state == "APPROVED"
                    and .user.login != $author
                    and (.author_association == "OWNER"
                         or .author_association == "MEMBER"
                         or .author_association == "COLLABORATOR")
                  ))
                | .[0].user.login // ""')"

          # Defence in depth: author_association is a label on the review; this is
          # the repository's own answer about push access.
          if [ -n "${approver}" ]; then
            perm="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${approver}/permission" \
              -q '.permission' 2>/dev/null || echo "none")"
            case "${perm}" in
              admin|maintain|write) ;;
              *)
                echo "::warning::@${approver} approved #${PR} but has '${perm}' access — not an authorizing review."
                approver=""
                ;;
            esac
          fi

          if [ -z "${approver}" ]; then
            echo "::warning::#${PR} left decision records at 'gated' and carried no authorizing review."
            echo "::warning::They stay gated on purpose: a merge is not an approval act while an agent can perform it (decision-0080)."
            for f in ${gated}; do echo "  · ${f}"; done
            exit 0
          fi

          for f in ${gated}; do
            STAMP="status: approved  # recorded by ratify-flip: #${PR} approved in review by @${approver} — the review is the intent act, this line records it (decision-0046, decision-0080)"
            export STAMP
            python3 - "${f}" <<'PY'
import os, pathlib, sys
p = pathlib.Path(sys.argv[1])
lines = p.read_text().split("\n")
for i, line in enumerate(lines):
    if line.startswith("status: gated"):
        lines[i] = os.environ["STAMP"]
        break
p.write_text("\n".join(lines))
PY
            echo "recorded approval on ${f}"
          done

          git config user.name "ratify-flip"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ${gated}
          git commit -m "ratify-flip: record @${approver}'s approval from #${PR}

The intent act is the human approval review on #${PR}; this commit records it
(decision-0046, decision-0080). Author of the records != approver."

          # concurrency: above serialises runs, but a human push can still land
          # between checkout and push. Losing the race must not lose the record.
          pushed=""
          for attempt in 1 2 3; do
            if git pull --rebase --quiet origin main && git push --quiet origin main; then
              pushed="yes"; break
            fi
            echo "push attempt ${attempt} failed; retrying"
            sleep 5
          done
          if [ -z "${pushed}" ]; then
            echo "::error::could not push the approval record for #${PR} after 3 attempts — it is still 'gated'."
            exit 1
          fi
          echo "recorded @${approver}'s approval from #${PR}"
