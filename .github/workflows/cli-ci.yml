name: cli-ci

# Build + vet + test the Go payload generator (decision-0023; generator-only since
# decision-0043 / #120). This is the verification the maintainer's environment relies
# on — the code is authored where `go` isn't installed, so a green run here is what
# proves it builds and its tests pass. These tests are also the payload guards:
# regenerate-and-diff on the vendored payload (the repo's own overlay sync-guard
# retired with the overlay itself, decision-0071),
# the docs-consistency check, and the staleness-hook contract.

# The paths filter is a coverage contract, not a convenience. build-test is the
# only job that runs `go test`, so EVERY file the suite reads out of the repo has
# to be selected here — otherwise a PR touching only that file skips the one guard
# that pins it, and nothing is ever red. Hence: the doc surfaces (docs/, README,
# install.sh, plugins/) for the docs-consistency test (decision-0025);
# .github/scripts/** and decision-id-guard.yml, which cli/decision_id_guard_test.go
# executes and reads (decision-0089); core/invariants/** and profiles/**, which
# cli/row_set_guard_test.go reads; .claude/**, which cli/selfapply_test.go and
# cli/docs_consistency_test.go read; and .grove/**, so that the PR reinstating the
# retired directory is the one cli/selfapply_test.go fails on (decision-0076).
#
# That rule is now checked rather than described: cli/ci_paths_guard_test.go
# extracts every repo-relative path cli/*_test.go reads and fails naming any this
# filter does not cover (TRL-50 — decision-0028, a guard per pair). Keep the two
# lists below identical; both are checked.
on:
  pull_request:
    paths: ["cli/**", "docs/**", "README.md", "AGENTS.md", "CLAUDE.md", ".trellis/**", ".claude/**", ".grove/**", "install.sh", "plugins/**", "core/catalog/**", "core/invariants/**", "profiles/**", ".github/workflows/cli-ci.yml", ".github/scripts/**", ".github/workflows/decision-id-guard.yml"]
  push:
    branches: [main]
    paths: ["cli/**", "docs/**", "README.md", "AGENTS.md", "CLAUDE.md", ".trellis/**", ".claude/**", ".grove/**", "install.sh", "plugins/**", "core/catalog/**", "core/invariants/**", "profiles/**", ".github/workflows/cli-ci.yml", ".github/scripts/**", ".github/workflows/decision-id-guard.yml"]

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v5
      # cli/codex_hook_test.go executes the production Codex hook; Phase 1's
      # explicit local hook prerequisite is Node.js >=20 (decision-0058).
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false  # dependency-free since #120 (x/term retired with the TUI)
      - run: go build ./...
      - run: go vet ./...
      # -count=1 disables Go's test cache. cli/plugin_hook_test.go and
      # cli/codex_hook_test.go execute the production hooks
      # (plugins/trellis/hooks/staleness.sh, hooks/codex-context.mjs) as
      # external files; the cache keys on Go sources and inputs it can see, so
      # a hook mutation with no .go change replays a stale PASS. Reproduced by
      # deleting codex-context.mjs's empty-slug-set guard: `ok (cached)`, then
      # red under -count=1. Redundant on a fresh CI runner (cache: false above,
      # and nothing to restore) — kept so this line and AGENTS.md's documented
      # command are the same command, and the local run is safe by default.
      - run: go test -count=1 ./...
