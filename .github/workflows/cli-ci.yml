name: cli-ci

# Run repository quality checks, then build + test the Go payload generator (decision-0023; generator-only since
# decision-0043 / #120). This is the verification the maintainer's environment relies
# on — the code is authored where `go` isn't installed, so a green run here is what
# proves it builds and its tests pass. These tests are also the payload guards:
# regenerate-and-diff on the vendored payload (the repo's own overlay sync-guard
# retired with the overlay itself, decision-0071),
# the docs-consistency check, and the staleness-hook contract.
#
# build-test runs on every pull request and every push to main. It runs
# unconditionally because the suite reads files from across the repository, so a
# PR touching any of them has to run it.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  # build-test is a required status check on main (ruleset "main protection").
  # Renaming this job, or giving the triggers above a paths or paths-ignore filter,
  # leaves that check pending on every PR and blocks every merge: change the
  # ruleset in the same change.
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
      # The file-size and debt-marker gates run as their own steps so that an edit to
      # package.json's `quality` chain cannot drop them from the required check.
      # `npm run quality` below still runs them too, for the local command.
      - run: scripts/check-file-size.sh
        working-directory: .
      - run: scripts/check-todos.sh
        working-directory: .
      # cli/codex_hook_test.go executes the production Codex hook; Phase 1's
      # explicit local hook prerequisite is Node.js >=20 (decision-0058).
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
          cache: false  # dependency-free since #120 (x/term retired with the TUI)
      # The runner image ships ShellCheck (ubuntu-latest was ubuntu-24.04 in
      # September 2026), so apt runs only when it is missing; skipping it spares the
      # required check a mirror download. When apt does run, Acquire::Retries
      # retries a failed package download.
      - name: Install ShellCheck
        run: command -v shellcheck >/dev/null || { sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install --yes shellcheck; }
        working-directory: .
      - run: npm ci
        working-directory: .
      - run: npm run quality
        working-directory: .
        # setup-go@v6+ exports GOTOOLCHAIN=local. The quality bar's staticcheck
        # (v0.8.1) needs Go >= 1.26 while this job pins 1.22; under setup-go@v5 the
        # go command downloaded a newer toolchain for it on its own. auto restores
        # that for this step only; build, vet and test stay on the pinned 1.22.
        env:
          GOTOOLCHAIN: auto
      - run: go build ./...
      - run: go vet ./...
      # -count=1 disables Go's test cache. cli/plugin_hook_test.go and
      # cli/codex_hook_test.go execute the production hooks
      # (plugins/trellis/hooks/staleness.sh, hooks/codex-context.mjs) as
      # external files; the cache keys on Go sources and inputs it can see, so
      # a hook mutation with no .go change replays a stale PASS. Reproduced by
      # deleting codex-context.mjs's empty-slug-set guard: `ok (cached)`, then
      # red under -count=1. Redundant on a fresh CI runner (cache: false above,
      # and nothing to restore) — kept so this line and AGENTS.md's documented
      # command are the same command, and the local run is safe by default.
      # The coverprofile feeds the coverage floor below; AGENTS.md's command
      # stays the canonical local form — the profile is CI-side plumbing.
      - run: go test -count=1 -coverprofile="$RUNNER_TEMP/cover.out" ./...
      # The floor is a ratchet (scripts/check-coverage.sh): 90 sits below the
      # 92.3% measured at introduction. Raise it as coverage climbs. Runs from
      # the module directory — `go tool cover` resolves the profile's package
      # paths against go.mod.
      - run: ../scripts/check-coverage.sh "$RUNNER_TEMP/cover.out" 90
