# This repo's override of grove's story-worker routing table.
# Keyed by operation id; an override may set only `performers` and `fallback`.
# Setup merges it over the skill's own routing.toml before binding.
#
# Trellis uses the Compound Engineering skills for every fix and its review loop
# (TRL-108). The skill's table suggests the built-in `code-review` first for the
# floor review, so a worker here would review with it unless told otherwise;
# this points the floor review at `ce-code-review` instead.

[operation.review]
performers = ["ce-code-review"]
